model_list:
  # Claude Series 4.5 (Forecasted/New)
  - model_name: claude-opus-4-5
    litellm_params:
      model: anthropic/claude-opus-4-5-20251101
      api_key: os.environ/ANTHROPIC_API_KEY
  
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.0000008
      output_cost_per_token: 0.000004

  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY

  # Claude Series 4
  - model_name: claude-opus-4
    litellm_params:
      model: anthropic/claude-opus-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  # Legacy / Current Stable
  - model_name: claude-3-5-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # Claude 4.6
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # Aliases
  - model_name: claude-haiku-4
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      input_cost_per_token: 0.0000008
      output_cost_per_token: 0.000004

  # Gemini (fallbacks)
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY

  # Embeddings (OpenAI)
  - model_name: text-embedding-3-small
    litellm_params:
      model: text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # OpenRouter
  - model_name: openrouter-claude-3-5-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: os.environ/OPENROUTER_KEY

  - model_name: openrouter-claude-3-5-haiku
    litellm_params:
      model: openrouter/anthropic/claude-3.5-haiku
      api_key: os.environ/OPENROUTER_KEY

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  timeout: 120
  retry_after: 3
  allowed_fails: 1
  fallbacks:
    - claude-sonnet-4-6: ["claude-opus-4-6", "claude-sonnet-4-5", "gemini-3.1-pro-preview", "gemini-2.5-pro"]

litellm_settings:
  drop_params: true
  set_verbose: false
  callbacks: ["langsmith", "litellm_callbacks.postgres_usage_logger"]

environment_variables:
  LANGSMITH_API_KEY: os.environ/LANGSMITH_API_KEY
  LANGSMITH_PROJECT: os.environ/LANGSMITH_PROJECT
  LANGCHAIN_TRACING_V2: "true"
